version: '3.9'

services:
  app:
    build: .
    container_name: banking-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: npm start
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  worker:
    build: .
    container_name: email-worker
    command: node workers/email.worker.js
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data: