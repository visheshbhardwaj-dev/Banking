version: '3.9'

services:
  app:
    build: .
    container_name: banking-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    command: npm start
    depends_on:
      - redis
    restart: always

  worker:
    build: .
    container_name: email-worker
    command: node workers/email.worker.js
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
